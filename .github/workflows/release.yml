name: Release version

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update_tag_manifest:
    name: Update Manifest in Release Tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version
        id: version
        uses: home-assistant/actions/helpers/version@master

      - name: Set manifest version number
        run: |
          python3 .github/scripts/update_version.py --version ${{ steps.version.outputs.version }}

      - name: Update Release Tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git add custom_components/fritzbox_voicemail/manifest.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: set manifest version to ${{ steps.version.outputs.version }}"
            git push origin HEAD:refs/tags/${{ github.event.release.tag_name }} --force
          fi